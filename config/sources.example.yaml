# Example Source Registry for Daily Brief.
#
# User-specific Source Registry lives outside the repository, normally at:
# ~/.daily-brief/sources.yaml
#
# Each Source has:
# - id: stable unique identifier
# - platform: content platform, such as blog, github, or youtube
# - adapter: logical Fetch Adapter name
# - target: adapter-specific locator or query
# - enabled: collection switch
# - notes: human-readable reason for including the Source

sources:
  - id: github-trending-daily
    platform: github
    adapter: github-trending
    target: https://github.com/trending?since=daily
    enabled: true
    notes: Site-wide daily GitHub Trending; Brief generation filters for Agent Architecture and AI Coding signals
  - id: openai-news-product-releases
    platform: openai-news
    adapter: openai-news
    target: https://openai.com/news/product-releases/
    enabled: true
    notes: Official OpenAI Product News page for major product releases and capability updates
  - id: openai-news-engineering
    platform: openai-news
    adapter: openai-news
    target: https://openai.com/news/engineering/
    enabled: true
    notes: Official OpenAI Engineering News page for implementation, infrastructure, and systems articles
  - id: openai-news-research
    platform: openai-news
    adapter: openai-news
    target: https://openai.com/news/research/
    enabled: true
    notes: Official OpenAI Research News page for model, evaluation, and research announcements
  - id: openai-news-safety
    platform: openai-news
    adapter: openai-news
    target: https://openai.com/news/safety/
    enabled: true
    notes: Official OpenAI Safety News page for safety, preparedness, and policy-relevant updates
  - id: anthropic-news
    platform: anthropic
    adapter: anthropic-news
    target: https://www.anthropic.com/news
    enabled: true
    notes: Official Anthropic Newsroom for product, policy, company, and research announcements
  - id: anthropic-engineering
    platform: anthropic
    adapter: anthropic-news
    target: https://www.anthropic.com/engineering
    enabled: true
    notes: Official Anthropic Engineering page for Claude Code, agents, evals, and infrastructure posts
  - id: claude-platform-release-notes
    platform: claude-platform
    adapter: claude-platform-release-notes
    target: https://platform.claude.com/docs/en/release-notes/overview
    enabled: true
    notes: Official Claude Platform release notes for API, SDK, console, model, and platform changes
  - id: claude-code-releases
    platform: github
    adapter: rss
    target: https://github.com/anthropics/claude-code/releases.atom
    enabled: true
    notes: Anthropic Claude Code GitHub Releases Atom feed for CLI and product update tracking
